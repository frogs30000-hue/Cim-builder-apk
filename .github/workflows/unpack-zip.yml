name: Unpack project zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack CiMBuilderTest.zip
        run: |
          test -f CiMBuilderTest.zip
          mkdir _unpacked
          unzip -q CiMBuilderTest.zip -d _unpacked
          rm -rf _unpacked/.github
          cp -r _unpacked/. .
          rm -rf _unpacked CiMBuilderTest.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack CiM Builder Test project"
          git push
